name: new_usecase_test
description: >
  Generates a unit test for a usecase. Mocks the repository with mocktail
  and tests both DataSuccess and DataFailed paths. Works for both
  no-param (UseCaseBase) and parameterised (UseCaseWithRequest) usecases.
  usecase_name must include the "UseCase" suffix (e.g. "GetAllUserUseCase").
version: 0.1.0+1

vars:
  feature_name:
    type: string
    description: Feature folder name (plural snake_case, e.g. "users")
    prompt: What is the feature name?

  entity_name:
    type: string
    description: Entity class name (singular PascalCase, e.g. "User")
    prompt: What is the entity name?

  usecase_name:
    type: string
    description: >
      Full usecase class name including "UseCase" suffix
      (PascalCase, e.g. "GetAllUserUseCase")
    prompt: What is the usecase name (with UseCase suffix)?

  return_type_name:
    type: string
    description: Return type (e.g. "List<User>" or "User")
    prompt: What is the return type?

  repository_method_name:
    type: string
    description: >
      Repository method name to verify delegation (camelCase, e.g. "getAll").
    default: ""

  has_param:
    type: boolean
    description: Whether the usecase takes a parameter (uses UseCaseWithRequest)
    default: false

  param_name:
    type: string
    description: Parameter name (camelCase, e.g. "id"). Only used when has_param=true.
    default: ""

  param_type:
    type: string
    description: Parameter type (e.g. "int"). Only used when has_param=true.
    default: ""


