name: new_repository_test
description: >
  Generates a unit test for a RepositoryImpl. Mocks the LocalDatasource
  with mocktail and tests each method for DataSuccess (on success) and
  DataFailed (on exception).
version: 0.1.0+1

vars:
  feature_name:
    type: string
    description: Feature folder name (plural snake_case, e.g. "users")
    prompt: What is the feature name?

  entity_name:
    type: string
    description: Entity class name (singular PascalCase, e.g. "User")
    prompt: What is the entity name?

  methods:
    type: list
    description: >
      Repository methods. Same schema as new_repository:
        name, return_type, has_param, param_name, param_type

