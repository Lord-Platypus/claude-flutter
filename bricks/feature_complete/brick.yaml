name: feature_complete
description: >
  Scaffolds an entire Clean Architecture feature by orchestrating the
  new_repository and new_page sub-bricks.

  Internally calls:
    1. mason make new_repository  →  entity + model + DAO + repository + usecases
    2. mason make new_page        →  BLoC + page UI  (once per entry in 'pages')

  See docs/bricks.md for the full JSON invocation schema and a copy-paste example.

version: 0.1.0+1

vars:
  feature_name:
    type: string
    description: >
      Feature folder name, plural snake_case (e.g. "users").
      Becomes lib/features/{feature_name}/.
    prompt: What is the feature name? (plural snake_case, e.g. "users")

  entity_name:
    type: string
    description: >
      Entity class name, singular PascalCase (e.g. "User").
      Used by new_repository to name entity, model and DAO.
    prompt: What is the entity name? (singular PascalCase, e.g. "User")

  fields:
    type: list
    description: >
      Fields for the entity. Each item must be an object with:
        name  – dart field name  (e.g. "title")
        type  – dart type        (e.g. "String")
      The 'id' field is always generated as @primaryKey; omit it here.
      Example:
        [{"name":"id","type":"int"},{"name":"title","type":"String"}]

  methods:
    type: list
    description: >
      Repository methods to generate. Each item must be an object with:
        name        – dart method name            (e.g. "getAll")
        return_type – verbatim Dart return type   (e.g. "List<User>")
        has_param   – boolean                     (true / false)
        param_name  – dart param name             (required when has_param=true)
        param_type  – dart param type             (required when has_param=true)
      Example:
        [
          {"name":"getAll","return_type":"List<User>","has_param":false,"param_name":"","param_type":""},
          {"name":"getById","return_type":"User","has_param":true,"param_name":"id","param_type":"int"}
        ]

  pages:
    type: list
    description: >
      One entry per page/BLoC pair to generate via new_page. Each item must be
      an object with:
        page_name   – PascalCase page name   (e.g. "UsersList")
        bloc_name   – PascalCase BLoC name   (e.g. "UsersList")
        bloc_events – list of extra event names (strings), may be []
        usecases    – list of usecase class names to inject (strings)
                      These must match the usecases already created by
                      new_repository (e.g. "GetAllUserUseCase").
        path        – (optional) custom route path for this page.
                      If omitted, auto-derived:
                        first page  → /{feature_name}
                        other pages → /{feature_name}/{page_name_snake}
                      Use this for path params, e.g. "/:id".
      Example:
        [
          {
            "page_name": "UsersList",
            "bloc_name": "UsersList",
            "bloc_events": ["LoadUsersEvent"],
            "usecases": ["GetAllUserUseCase"]
          },
          {
            "page_name": "UserDetail",
            "bloc_name": "UserDetail",
            "path": "/users/:id",
            "bloc_events": [],
            "usecases": ["GetByIdUserUseCase"]
          }
        ]

