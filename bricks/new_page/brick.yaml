name: new_page
description: A new page with Bloc and navigation for a specific feature.
version: 0.1.0+1

vars:
  feature_name:
    type: string
    description: The name of the feature (snake_case)

  page_name:
    type: string
    description: The name of the page (PascalCase)

  bloc_name:
    type: string
    description: The name of the bloc (PascalCase)

  bloc_events:
    type: list
    description: Additional events
    default: [ ]

  usecases:
    type: list
    description: Usecases injected into the bloc
    default: [ ]

  entity_name:
    type: string
    description: >
      Entity class name (singular PascalCase, e.g. "User").
      Used by the auto-generated bloc test to import the entity.
      Passed automatically when called from feature_complete.
    default: ""

  page_path:
    type: string
    description: >
      Custom route path for this page (e.g. "/users/:id").
      Used by the post-gen hook to register the destination and route.
      If empty, auto-derived as /{feature_name}/{page_name_snake}.
    default: ""

