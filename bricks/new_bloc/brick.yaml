name: new_bloc
description: >
  A standalone BLoC (bloc + event + state) for a feature, decoupled from any
  page. Scaffolds the sealed event/state classes, a Started event, optional
  extra events with TODO handlers, and injected usecases. Also composed by
  new_page (which passes the page folder as bloc_path) so the bloc code is
  defined in exactly one place.
version: 0.1.0+1

vars:
  feature_name:
    type: string
    description: The name of the feature (snake_case)

  bloc_name:
    type: string
    description: The name of the bloc (PascalCase, e.g. "ProductDetail")

  bloc_path:
    type: string
    description: >
      The presentation subfolder that will contain the bloc/ folder
      (snake_case, e.g. "product_detail"). Defaults to the bloc name when left
      empty. new_page passes the page folder here so the bloc nests under the
      page (presentation/{page}/bloc/).
    default: ""

  bloc_events:
    type: list
    description: Additional events beyond the auto-generated Started event
    default: [ ]

  usecases:
    type: list
    description: Usecases injected into the bloc constructor as private fields
    default: [ ]
